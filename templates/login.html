<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión Escolar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page">

    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="login-card card">
        <div class="emoji">🎓</div>
        <h1>Sistema de Gestión de Colegios</h1>
        <p>Ingrese sus credenciales</p>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group" style="text-align: left;">
                <label for="cedula">Cédula</label>
                <input type="text" id="cedula" name="cedula" class="form-control" required placeholder="Número de cédula">
            </div>
            
            <div class="form-group" style="text-align: left; margin-bottom: 24px;">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Su contraseña">
            </div>
            
            <button type="submit" class="btn btn-primary w-100 justify-center">Ingresar</button>
        </form>
        
        <div class="mt-3">
            <a href="{{ url_for('public.index') }}" class="text-secondary" style="font-size: 0.9rem; text-decoration: underline;">Ver información de matrículas</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
