version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: colegios_sqlserver
    restart: always
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - '1434:1433'
    volumes:
      - sqlserver_data:/var/opt/mssql

  web:
    build: .
    container_name: colegios_web
    restart: always
    depends_on:
      - sqlserver
    env_file:
      - .env
    environment:
      - DB_SERVER=sqlserver
    expose:
      - 5000

  nginx:
    image: nginx:alpine
    container_name: colegios_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web

volumes:
  sqlserver_data:
